{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
        <div class="auth-card-header">
            <div class="auth-icon animate-float">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h4>Welcome Back</h4>
            <p>Sign in to your compliance dashboard</p>
        </div>
        <div class="auth-card-body">
            <form method="POST" action="{{ url_for('auth.login') }}">
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>
                <button type="submit" class="btn-primary-custom">
                    <i class="bi bi-arrow-right-circle-fill"></i> Sign In
                </button>
            </form>
            <div class="auth-divider"></div>
            <p class="text-center mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
                New to NDPA Checker?
                <a href="{{ url_for('auth.register') }}" class="auth-link">Create Account</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
