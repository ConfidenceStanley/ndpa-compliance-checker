{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
        <div class="auth-card-header">
            <div class="auth-icon-box">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4>Create Account</h4>
            <p>Start checking compliance in minutes</p>
        </div>
        <div class="auth-card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="form-group">
                    <label class="form-label-custom">Username</label>
                    <input
                        type="text"
                        class="form-input"
                        name="username"
                        placeholder="Choose a username"
                        value="{{ form.username if form else '' }}"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label-custom">Email Address</label>
                    <input
                        type="email"
                        class="form-input"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>
                <div class="form-group">
                    <label class="form-label-custom">Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            class="form-input has-toggle"
                            name="password"
                            id="regPassword"
                            placeholder="Minimum 6 characters"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('regPassword', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label-custom">Confirm Password</label>
                    <div class="input-wrapper">
                        <input
                            type="password"
                            class="form-input has-toggle"
                            name="confirm_password"
                            id="regConfirm"
                            placeholder="Repeat your password"
                            required
                        >
                        <button type="button" class="password-toggle" onclick="togglePassword('regConfirm', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="bi bi-rocket-takeoff-fill"></i> Create Account
                </button>
            </form>
            <hr class="auth-divider">
            <p class="auth-footer-text">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
