{% extends 'base.html' %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card animate-slide-up">
        <div class="auth-card-header">
            <div class="auth-icon animate-float">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h4>Create Account</h4>
            <p>Start checking compliance in minutes</p>
        </div>
        <div class="auth-card-body">
            <form method="POST" action="{{ url_for('auth.register') }}">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Choose a username"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                    >
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Minimum 6 characters"
                        required
                    >
                </div>
                <div class="mb-4">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Repeat your password"
                        required
                    >
                </div>
                <button type="submit" class="btn-primary-custom">
                    <i class="bi bi-rocket-takeoff-fill"></i> Create Account
                </button>
            </form>
            <div class="auth-divider"></div>
            <p class="text-center mb-0" style="color: var(--text-muted); font-size: 0.9rem;">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="auth-link">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
